name: web-ci

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"

jobs:
  test:
    name: Typecheck + Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run

  lint:
    # Lint-to-zero campaign (soma#958): every backlog rule reports as a warning and this cap
    # only ever goes down. A PR that adds a finding fails here.
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: eslint (warning cap 506, lowered by every campaign PR)
        run: npx eslint . --max-warnings 506

  build-without-db:
    # `next build` must never need a database (soma#940). The production DATABASE_URL names the
    # estate gateway host, which no socket can resolve; a build-time query took every production
    # deploy down from 2026-09-09 to 2026-09-13 while the PR checks (no DATABASE_URL) stayed green.
    # This job builds with an unreachable host so a build-time query fails the PR, not production.
    name: Build without a database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build against an unreachable gateway host
        env:
          DATABASE_URL: postgresql://soma_ro:x@pg.example.invalid/soma
          AUTH_SECRET: ci-build-only
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
        run: npm run build
