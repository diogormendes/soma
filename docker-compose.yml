services:
  soma:
    image: drmspidi/soma:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "${SOMA_PORT:-3456}:3456"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3456
      HOSTNAME: 0.0.0.0
      SOMA_COMMIT_SHA: "${SOMA_COMMIT_SHA:-unknown}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3456/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
